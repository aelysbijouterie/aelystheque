<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aélysthèque</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:      #F5F1EE;
    --sand:       #EFE8E0;
    --gold:       #A87B27;
    --gold-light: #C9A04A;
    --navy:       #112033;
    --white:      #FFFFFF;
    --text:       #26313F;
    --text-muted: #7A7068;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
  }

  /* ── En-tête ─────────────────────────────────────────────────── */
  header {
    padding: 56px 24px 8px;
    text-align: center;
  }
  header .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 5vw, 2.4rem);
    color: var(--navy);
    letter-spacing: 0.3px;
  }
  header .rule {
    width: 40px;
    height: 2px;
    background: var(--gold-light);
    margin: 14px auto;
    border-radius: 2px;
  }
  header p {
    margin: 0 auto;
    max-width: 380px;
    color: var(--text-muted);
    font-size: 0.86rem;
    line-height: 1.4;
  }

  /* ── Barre de recherche ──────────────────────────────────────── */
  .search-wrap {
    display: flex;
    justify-content: center;
    padding: 28px 24px 4px;
  }
  #search {
    width: 100%;
    max-width: 320px;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid var(--sand);
    background: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.86rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search:focus { border-color: var(--gold-light); box-shadow: 0 0 0 3px rgba(200,160,74,0.15); }
  #search::placeholder { color: var(--text-muted); }

  /* ── Grille de tuiles, façon écran d'accueil ────────────────── */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 24px 70px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 28px 20px;
    justify-items: center;
  }
  .tool {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 104px;
    text-decoration: none;
    color: inherit;
    opacity: 0;
    animation: rise 0.45s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: var(--d, 0ms);
  }
  @media (prefers-reduced-motion: reduce) {
    .tool { opacity: 1; animation: none; }
    .tool.reveal .tool-icon { animation: none; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .tool-icon {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.1rem;
    background: var(--tile-bg, linear-gradient(155deg, #223354, #0d1a2e));
    box-shadow:
      0 1px 2px rgba(17,32,51,0.10),
      0 6px 16px rgba(17,32,51,0.10);
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1), box-shadow 0.18s ease;
    overflow: hidden;
    position: relative;
  }
  .tool-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tool:hover .tool-icon {
    transform: translateY(-3px) scale(1.045);
    box-shadow:
      0 2px 4px rgba(17,32,51,0.12),
      0 14px 28px rgba(17,32,51,0.18);
  }
  .tool:active .tool-icon {
    transform: scale(0.94);
    transition-duration: 0.08s;
  }
  .tool-name {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--navy);
    text-align: center;
    line-height: 1.25;
    max-width: 100px;
  }
  .tool-desc {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'DM Sans', sans-serif;
    font-size: 0.66rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.25;
    max-width: 104px;
  }

  /* ── Outil pas encore sorti : aperçu flouté + compte à rebours ── */
  .tool.locked { cursor: default; }
  .tool.locked:hover .tool-icon,
  .tool.locked:active .tool-icon { transform: none; }
  .tool-icon .teaser {
    position: absolute;
    inset: 0;
    filter: blur(7px) saturate(1.15);
    transform: scale(1.45);
  }
  .lock {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: rgba(17,32,51,0.42);
    color: #fff;
    text-align: center;
    padding: 4px;
  }
  .lock .cd {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.2px;
    line-height: 1.1;
  }
  .lock .at {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.54rem;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    opacity: 0.88;
    line-height: 1.2;
  }
  .lock svg { width: 14px; height: 14px; opacity: 0.9; }
  .blur { filter: blur(5px); user-select: none; pointer-events: none; }

  /* Au moment de la sortie : le flou se dissipe */
  .tool.reveal .tool-icon { animation: unveil 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes unveil {
    from { filter: blur(10px) brightness(1.2); transform: scale(1.15); }
    to   { filter: none; transform: scale(1); }
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.88rem;
    max-width: 380px;
    margin: 40px auto 0;
    line-height: 1.5;
  }

  footer {
    text-align: center;
    padding: 10px 20px 28px;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  footer .admin-link {
    display: inline-flex;
    vertical-align: middle;
    margin-left: 8px;
    color: var(--text-muted);
    opacity: 0.45;
    transition: opacity 0.15s ease;
  }
  footer .admin-link:hover, footer .admin-link:focus-visible { opacity: 1; }
  footer .admin-link svg { width: 13px; height: 13px; }
</style>
</head>
<body>

<header>
  <div class="wordmark">Aélythèque</div>
  <div class="rule"></div>
  <p>Tous les outils internes Aélys, au même endroit.</p>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="Rechercher un outil…" autocomplete="off" />
</div>

<main>
  <div id="grid" class="grid"></div>
  <p id="emptyMsg" class="empty" style="display:none;"></p>
</main>

<footer>Aélys Bijouterie
  <a class="admin-link" href="admin.html" aria-label="Administration" title="Administration">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </a>
</footer>

<script src="config.js"></script>
<script>
  // ═══════════════════════════════════════════════════════════════
  //  La liste des outils est maintenant gérée depuis admin.html.
  //  Cette liste n'est qu'un FILET DE SÉCURITÉ : affichée seulement
  //  si la base est injoignable et qu'aucune copie n'est en mémoire.
  // ═══════════════════════════════════════════════════════════════
  const FALLBACK = [
    { id: 'f1', name: "Aurel'IA", desc: "Bibliothèque de procédures", url: "https://chatbot-alpha-sepia-22.vercel.app/", icon: "📚", image: "aureil-ia-icon.jpg", color: "#A87B27" },
    { id: 'f2', name: "SIMONE", desc: "Recherche de références SIMONE A BORDEAUX", url: "https://recherche-reference-simone.netlify.app/", icon: "🔍", image: "simone-icon.jpg", color: "#A87B27" },
    { id: 'f3', name: "TEMPO", desc: "Gestion des visuels opérations magasin", url: "https://pac-aelys.vercel.app/connexion-boutique", icon: "🖼️", image: "tempo.jpg", color: "#A87B27" }
  ];

  const CFG = window.AELYS_CONFIG || {};
  const CACHE_KEY = 'aelytheque.tools.v1';

  let tools = [];          // outils normalisés
  let offset = 0;          // décalage horloge serveur - horloge de l'appareil
  let prevLocked = new Set();
  let reloading = false;

  // ── Utilitaires ─────────────────────────────────────────────────

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Seuls les liens http(s) ou relatifs sont acceptés
  function safeUrl(u) {
    if (!u) return '#';
    return /^(https?:\/\/|\/|\.\/|[\w-]+\.[\w]+$)/i.test(u) ? u : '#';
  }

  function shade(hex, amount) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return null;
    const num = parseInt(m[1], 16);
    const ch = v => Math.max(0, Math.min(255, Math.round(v * amount)));
    const r = ch((num >> 16) & 255), g = ch((num >> 8) & 255), b = ch(num & 255);
    return `#${[r,g,b].map(x => x.toString(16).padStart(2,'0')).join('')}`;
  }

  function tileBackground(color) {
    if (!/^#[0-9a-f]{6}$/i.test(color || '')) return null;
    return `linear-gradient(155deg, ${color}, ${shade(color, 0.62)})`;
  }

  const nowMs = () => Date.now() + offset;
  const pad = n => String(n).padStart(2, '0');

  function countdown(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600),
          m = Math.floor((s % 3600) / 60), x = s % 60;
    return d > 0 ? `${d}j ${pad(h)}h${pad(m)}` : `${pad(h)}:${pad(m)}:${pad(x)}`;
  }

  function releaseLabel(ms) {
    const d = new Date(ms), t = new Date(nowMs());
    const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const sameDay = d.toDateString() === t.toDateString();
    return sameDay ? `dès ${hm}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)} · ${hm}`;
  }

  // ── Chargement ──────────────────────────────────────────────────

  function normalize(t) {
    return {
      id: t.id, name: t.name, desc: t.descr != null ? t.descr : t.desc,
      url: t.url, icon: t.icon, image: t.image, color: t.color, teaser: t.teaser,
      locked: !!t.locked, releaseAt: t.release_at ? new Date(t.release_at).getTime() : null
    };
  }

  async function load() {
    try {
      if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) throw new Error('config');
      const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/get_tools`, {
        method: 'POST',
        headers: {
          apikey: CFG.supabaseAnonKey,
          Authorization: `Bearer ${CFG.supabaseAnonKey}`,
          'Content-Type': 'application/json'
        },
        body: '{}'
      });
      if (!r.ok) throw new Error('http ' + r.status);
      const data = await r.json();
      offset = new Date(data.now).getTime() - Date.now();
      tools = data.tools.map(normalize);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    } catch (e) {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e2) {}
      if (cached && cached.tools) {
        // Copie locale : on ne ré-évalue pas les verrous avec l'horloge de l'appareil
        offset = new Date(cached.now).getTime() - Date.now();
        tools = cached.tools.map(normalize);
      } else {
        tools = FALLBACK;
      }
    }
  }

  // ── Rendu ───────────────────────────────────────────────────────

  function tileHtml(t, i, reveal) {
    const bg = tileBackground(t.color);
    const style = ` style="${bg ? `--tile-bg:${escapeHtml(bg)}; ` : ''}--d:${i * 45}ms"`;

    if (t.locked && t.releaseAt) {
      const teaser = t.teaser ? `<img class="teaser" src="${escapeHtml(t.teaser)}" alt="" />` : '';
      return `
        <div class="tool locked" data-id="${escapeHtml(t.id)}" aria-disabled="true"${style}>
          <div class="tool-icon">
            ${teaser}
            <div class="lock" data-release="${t.releaseAt}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <span class="cd">--:--:--</span>
              <span class="at">${escapeHtml(releaseLabel(t.releaseAt))}</span>
            </div>
          </div>
          <div class="tool-name blur">${escapeHtml(t.name)}</div>
          <div class="tool-desc blur">${escapeHtml(t.desc)}</div>
        </div>`;
    }

    const iconInner = t.image
      ? `<img src="${escapeHtml(t.image)}" alt="" loading="lazy" />`
      : escapeHtml(t.icon || '🔗');
    const desc = t.desc ? `<div class="tool-desc">${escapeHtml(t.desc)}</div>` : '';
    return `
      <a class="tool${reveal ? ' reveal' : ''}" href="${escapeHtml(safeUrl(t.url))}"${style}>
        <div class="tool-icon">${iconInner}</div>
        <div class="tool-name">${escapeHtml(t.name)}</div>
        ${desc}
      </a>`;
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const emptyMsg = document.getElementById('emptyMsg');
    const q = document.getElementById('search').value.trim().toLowerCase();

    const list = !q ? tools : tools.filter(t => !t.locked &&
      ((t.name || '').toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q)));

    if (tools.length === 0) {
      grid.innerHTML = '';
      emptyMsg.textContent = 'Aucun outil pour l’instant.';
      emptyMsg.style.display = 'block';
      return;
    }
    if (list.length === 0) {
      grid.innerHTML = '';
      emptyMsg.textContent = 'Aucun outil ne correspond à cette recherche.';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    grid.innerHTML = list.map((t, i) => tileHtml(t, i, !t.locked && prevLocked.has(t.id))).join('');
    prevLocked = new Set(tools.filter(t => t.locked).map(t => t.id));
    tick();
  }

  // ── Compte à rebours ────────────────────────────────────────────

  function tick() {
    let expired = false;
    document.querySelectorAll('.lock[data-release]').forEach(el => {
      const left = Number(el.dataset.release) - nowMs();
      el.querySelector('.cd').textContent = countdown(left);
      if (left <= 0) expired = true;
    });
    // L'heure est passée : on redemande la liste au serveur (qui, lui,
    // décide du déverrouillage). Nouvel essai toutes les 2 s si besoin.
    if (expired && !reloading) {
      reloading = true;
      refresh().finally(() => setTimeout(() => { reloading = false; }, 2000));
    }
  }

  async function refresh() {
    await load();
    renderGrid();
  }

  document.getElementById('search').addEventListener('input', renderGrid);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  setInterval(tick, 1000);

  // Premier affichage : copie locale tout de suite (pas d'écran vide), puis liste à jour
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && c.tools) { offset = new Date(c.now).getTime() - Date.now(); tools = c.tools.map(normalize); renderGrid(); }
  } catch (e) {}
  refresh();
</script>

</body>
</html>
