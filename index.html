<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#cfc6b6" />
<title>Aélysthèque</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #2f2519;
    --ink-soft: rgba(47,37,25,.62);
    --glass: rgba(255,255,255,.34);
    --glass-edge: rgba(255,255,255,.75);
    --gold-light: #A87B27;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #cfc6b6;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'DM Sans', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Fond d'écran Apple « champagne » ────────────────────────── */
  .wallpaper { position: fixed; inset: 0; z-index: -1; background-color: #cfc6b6;
    background-image: url("wallpaper.jpg");
    background-size: cover; background-position: center; background-repeat: no-repeat; }
  .wallpaper::after {            /* voile : le visuel passe en fondu derrière les apps */
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 75% 65% at 50% 42%, rgba(250,246,238,.50), rgba(250,246,238,0) 75%),
      linear-gradient(180deg, rgba(247,242,233,.30), rgba(247,242,233,.18));
    -webkit-backdrop-filter: blur(5px) saturate(.9); backdrop-filter: blur(5px) saturate(.9);
  }

  /* Horloge façon barre de menus macOS */
  .menuclock {
    position: fixed; top: 14px; right: 18px; z-index: 5;
    padding: 6px 14px; border-radius: 999px; font-size: .76rem; font-weight: 500; letter-spacing: .1px;
    color: var(--ink); text-transform: capitalize; white-space: nowrap;
    border: 1px solid var(--glass-edge); background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(70,52,28,.14);
    font-variant-numeric: tabular-nums;
  }

  /* ── En-tête ─────────────────────────────────────────────────── */
  header { padding: 60px 24px 6px; text-align: center; }
  header .wordmark {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(2rem, 5.5vw, 2.7rem);
    letter-spacing: .3px;
    text-shadow: 0 2px 24px rgba(255,255,255,.5);
  }
  header .rule { width: 40px; height: 2px; background: var(--gold-light); margin: 14px auto; border-radius: 2px; opacity: .9; }
  header p { margin: 0 auto; max-width: 380px; color: var(--ink-soft); font-size: .88rem; line-height: 1.4; }

  /* ── Recherche : pastille de verre liquide ───────────────────── */
  .search-wrap { display: flex; justify-content: center; padding: 30px 24px 4px; }
  .sbox { position: relative; width: 100%; max-width: 280px;
    transition: max-width .3s cubic-bezier(.2,.8,.2,1); }
  .sbox:focus-within { max-width: 360px; }
  .sbox kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none;
    font: 500 .68rem -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; color: var(--ink-soft);
    padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.7); }
  .sbox:focus-within kbd { display: none; }
  #search {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 999px;
    border: 1px solid var(--glass-edge);
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f2519' stroke-opacity='.6' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") no-repeat 15px 50% / 16px,
      var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
            backdrop-filter: blur(24px) saturate(1.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.38), inset 0 -1px 0 rgba(255,255,255,.06), 0 8px 24px rgba(70,52,28,.22);
    font: 400 .9rem -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'DM Sans', sans-serif;
    color: var(--ink);
    outline: none;
    transition: background-color .2s ease, box-shadow .2s ease;
  }
  #search::placeholder { color: rgba(47,37,25,.5); }
  #search:focus { box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 3px rgba(255,255,255,.18), 0 10px 30px rgba(70,52,28,.28); }

  /* ── Grille Launchpad ────────────────────────────────────────── */
  main { max-width: 860px; margin: 0 auto; padding: 44px 24px 120px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 40px 14px;
    justify-items: center;
  }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    width: 100%; max-width: 112px;
    text-decoration: none; color: inherit;
    opacity: 0;
    animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: var(--d, 0ms);
  }
  @media (prefers-reduced-motion: reduce) {
    .tool { opacity: 1; animation: none; }
    .tool.reveal .tool-icon { animation: none; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }

  /* Icône « liquid glass » : teinte + reflet spéculaire + bord lumineux */
  .tool-icon {
    width: 94px; height: 94px;
    border-radius: 27px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem;
    background: var(--tile-bg, linear-gradient(155deg, #4a6fa8, #1b2f55));
    position: relative; overflow: hidden;
    box-shadow:
      0 14px 30px rgba(70,52,28,.38),
      0 2px 6px rgba(70,52,28,.28),
      inset 0 0 0 1px rgba(255,255,255,.26),
      inset 0 1.5px 1px rgba(255,255,255,.6),
      inset 0 -12px 20px rgba(255,255,255,.07);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease;
  }
  .tool-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tool-icon::after {            /* reflet de verre par-dessus l'icône */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
    background:
      radial-gradient(120% 75% at var(--mx, 25%) var(--my, -10%), rgba(255,255,255,.6), rgba(255,255,255,0) 58%),
      linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 40%);
    mix-blend-mode: soft-light;
  }
  .tool:hover .tool-icon {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 22px 44px rgba(70,52,28,.45), 0 4px 10px rgba(70,52,28,.3),
      inset 0 0 0 1px rgba(255,255,255,.34), inset 0 1.5px 1px rgba(255,255,255,.7), inset 0 -12px 20px rgba(255,255,255,.1);
  }
  .tool:active .tool-icon { transform: scale(.93); transition-duration: .08s; }
  .tool:focus-visible .tool-icon { outline: 3px solid rgba(47,37,25,.45); outline-offset: 3px; }

  .tool-name {
    font-size: .8rem; font-weight: 500; text-align: center; line-height: 1.25; max-width: 108px;
    text-shadow: 0 1px 8px rgba(255,255,255,.55);
  }
  .tool-desc {
    font-size: .66rem; color: var(--ink-soft); text-align: center; line-height: 1.25; max-width: 108px;
    text-shadow: 0 1px 6px rgba(255,255,255,.5); margin-top: -5px;
  }

  /* ── Outil pas encore sorti ──────────────────────────────────── */
  .tool.locked { cursor: default; }
  .tool.locked:hover .tool-icon, .tool.locked:active .tool-icon { transform: none; }
  .tool-icon .teaser { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: blur(8px) saturate(1.3); transform: scale(1.5); }
  .lock {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: rgba(70,52,28,.40);
    -webkit-backdrop-filter: blur(3px) saturate(1.4); backdrop-filter: blur(3px) saturate(1.4);
    text-align: center; padding: 4px; color: #fff;
  }
  .lock .cd { font-size: .86rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .2px; line-height: 1.1;
    text-shadow: 0 1px 8px rgba(70,52,28,.4); }
  .lock .at { font-size: .54rem; letter-spacing: .8px; text-transform: uppercase; opacity: .9; line-height: 1.2; }
  .lock svg { width: 14px; height: 14px; opacity: .92; }
  .blur { filter: blur(5px); user-select: none; pointer-events: none; }

  .tool.reveal .tool-icon { animation: unveil 1.1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes unveil {
    from { filter: blur(12px) brightness(1.4); transform: scale(1.18); }
    to   { filter: none; transform: none; }
  }

  .empty { text-align: center; color: var(--ink-soft); font-size: .9rem; max-width: 380px; margin: 40px auto 0; line-height: 1.5; }

  /* ── Pied : pastille de verre flottante, façon Dock ──────────── */
  footer {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 9px 18px; border-radius: 999px; white-space: nowrap;
    font-size: .72rem; color: var(--ink-soft);
    border: 1px solid var(--glass-edge);
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 30px rgba(70,52,28,.28);
  }
  footer .admin-link { display: inline-flex; color: inherit; opacity: .7; transition: opacity .15s ease; }
  footer .admin-link:hover, footer .admin-link:focus-visible { opacity: 1; }
  footer .admin-link svg { width: 13px; height: 13px; }

  @media (max-width: 420px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 34px 8px; }
    .tool-icon { width: 80px; height: 80px; border-radius: 23px; }
  }
</style>
</head>
<body>

<div class="wallpaper" aria-hidden="true"></div>
<div class="menuclock" id="clock" aria-hidden="true"></div>

<header>
  <div class="wordmark">Aélythèque</div>
  <div class="rule"></div>
  <p>Tous les outils internes Aélys, au même endroit.</p>
</header>

<div class="search-wrap">
  <div class="sbox">
    <input id="search" type="search" placeholder="Rechercher" autocomplete="off" aria-label="Rechercher un outil" />
    <kbd>/</kbd>
  </div>
</div>

<main>
  <div id="grid" class="grid"></div>
  <p id="emptyMsg" class="empty" style="display:none;"></p>
</main>

<footer>Aélys Bijouterie
  <a class="admin-link" href="admin.html" aria-label="Administration" title="Administration">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </a>
</footer>

<script src="config.js"></script>
<script>
  // ═══════════════════════════════════════════════════════════════
  //  La liste des outils est maintenant gérée depuis admin.html.
  //  Cette liste n'est qu'un FILET DE SÉCURITÉ : affichée seulement
  //  si la base est injoignable et qu'aucune copie n'est en mémoire.
  // ═══════════════════════════════════════════════════════════════
  const FALLBACK = [
    { id: 'f1', name: "Aurel'IA", desc: "Bibliothèque de procédures", url: "https://chatbot-alpha-sepia-22.vercel.app/", icon: "📚", image: "aureil-ia-icon.jpg", color: "#A87B27" },
    { id: 'f2', name: "SIMONE", desc: "Recherche de références SIMONE A BORDEAUX", url: "https://recherche-reference-simone.netlify.app/", icon: "🔍", image: "simone-icon.jpg", color: "#A87B27" },
    { id: 'f3', name: "TEMPO", desc: "Gestion des visuels opérations magasin", url: "https://pac-aelys.vercel.app/connexion-boutique", icon: "🖼️", image: "tempo.jpg", color: "#A87B27" }
  ];

  const CFG = window.AELYS_CONFIG || {};
  const CACHE_KEY = 'aelytheque.tools.v1';

  let tools = [];          // outils normalisés
  let offset = 0;          // décalage horloge serveur - horloge de l'appareil
  let prevLocked = new Set();
  let reloading = false;

  // ── Utilitaires ─────────────────────────────────────────────────

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Seuls les liens http(s) ou relatifs sont acceptés
  function safeUrl(u) {
    if (!u) return '#';
    return /^(https?:\/\/|\/|\.\/|[\w-]+\.[\w]+$)/i.test(u) ? u : '#';
  }

  function shade(hex, amount) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return null;
    const num = parseInt(m[1], 16);
    const ch = v => Math.max(0, Math.min(255, Math.round(v * amount)));
    const r = ch((num >> 16) & 255), g = ch((num >> 8) & 255), b = ch(num & 255);
    return `#${[r,g,b].map(x => x.toString(16).padStart(2,'0')).join('')}`;
  }

  function tileBackground(color) {
    if (!/^#[0-9a-f]{6}$/i.test(color || '')) return null;
    return `linear-gradient(155deg, ${color}, ${shade(color, 0.62)})`;
  }

  const nowMs = () => Date.now() + offset;
  const pad = n => String(n).padStart(2, '0');

  function countdown(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600),
          m = Math.floor((s % 3600) / 60), x = s % 60;
    return d > 0 ? `${d}j ${pad(h)}h${pad(m)}` : `${pad(h)}:${pad(m)}:${pad(x)}`;
  }

  function releaseLabel(ms) {
    const d = new Date(ms), t = new Date(nowMs());
    const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const sameDay = d.toDateString() === t.toDateString();
    return sameDay ? `dès ${hm}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)} · ${hm}`;
  }

  // ── Chargement ──────────────────────────────────────────────────

  function normalize(t) {
    return {
      id: t.id, name: t.name, desc: t.descr != null ? t.descr : t.desc,
      url: t.url, icon: t.icon, image: t.image, color: t.color, teaser: t.teaser,
      locked: !!t.locked, releaseAt: t.release_at ? new Date(t.release_at).getTime() : null
    };
  }

  async function load() {
    try {
      if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) throw new Error('config');
      const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/get_tools`, {
        method: 'POST',
        headers: {
          apikey: CFG.supabaseAnonKey,
          Authorization: `Bearer ${CFG.supabaseAnonKey}`,
          'Content-Type': 'application/json'
        },
        body: '{}'
      });
      if (!r.ok) throw new Error('http ' + r.status);
      const data = await r.json();
      offset = new Date(data.now).getTime() - Date.now();
      tools = data.tools.map(normalize);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    } catch (e) {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e2) {}
      if (cached && cached.tools) {
        // Copie locale : on ne ré-évalue pas les verrous avec l'horloge de l'appareil
        offset = new Date(cached.now).getTime() - Date.now();
        tools = cached.tools.map(normalize);
      } else {
        tools = FALLBACK;
      }
    }
  }

  // ── Rendu ───────────────────────────────────────────────────────

  function tileHtml(t, i, reveal) {
    const bg = tileBackground(t.color);
    const style = ` style="${bg ? `--tile-bg:${escapeHtml(bg)}; ` : ''}--d:${i * 45}ms"`;

    if (t.locked && t.releaseAt) {
      const teaser = t.teaser ? `<img class="teaser" src="${escapeHtml(t.teaser)}" alt="" />` : '';
      return `
        <div class="tool locked" data-id="${escapeHtml(t.id)}" aria-disabled="true"${style}>
          <div class="tool-icon">
            ${teaser}
            <div class="lock" data-release="${t.releaseAt}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <span class="cd">--:--:--</span>
              <span class="at">${escapeHtml(releaseLabel(t.releaseAt))}</span>
            </div>
          </div>
          <div class="tool-name blur">${escapeHtml(t.name)}</div>
          <div class="tool-desc blur">${escapeHtml(t.desc)}</div>
        </div>`;
    }

    const iconInner = t.image
      ? `<img src="${escapeHtml(t.image)}" alt="" loading="lazy" />`
      : escapeHtml(t.icon || '🔗');
    const desc = t.desc ? `<div class="tool-desc">${escapeHtml(t.desc)}</div>` : '';
    return `
      <a class="tool${reveal ? ' reveal' : ''}" href="${escapeHtml(safeUrl(t.url))}"${style}>
        <div class="tool-icon">${iconInner}</div>
        <div class="tool-name">${escapeHtml(t.name)}</div>
        ${desc}
      </a>`;
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const emptyMsg = document.getElementById('emptyMsg');
    const q = document.getElementById('search').value.trim().toLowerCase();

    const list = !q ? tools : tools.filter(t => !t.locked &&
      ((t.name || '').toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q)));

    if (tools.length === 0) {
      grid.innerHTML = '';
      emptyMsg.textContent = 'Aucun outil pour l’instant.';
      emptyMsg.style.display = 'block';
      return;
    }
    if (list.length === 0) {
      grid.innerHTML = '';
      emptyMsg.textContent = 'Aucun outil ne correspond à cette recherche.';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    grid.innerHTML = list.map((t, i) => tileHtml(t, i, !t.locked && prevLocked.has(t.id))).join('');
    prevLocked = new Set(tools.filter(t => t.locked).map(t => t.id));
    tick();
  }

  // ── Compte à rebours ────────────────────────────────────────────

  function tick() {
    let expired = false;
    document.querySelectorAll('.lock[data-release]').forEach(el => {
      const left = Number(el.dataset.release) - nowMs();
      el.querySelector('.cd').textContent = countdown(left);
      if (left <= 0) expired = true;
    });
    // L'heure est passée : on redemande la liste au serveur (qui, lui,
    // décide du déverrouillage). Nouvel essai toutes les 2 s si besoin.
    if (expired && !reloading) {
      reloading = true;
      refresh().finally(() => setTimeout(() => { reloading = false; }, 2000));
    }
  }

  async function refresh() {
    await load();
    renderGrid();
  }

  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', renderGrid);

  // « / » ou ⌘K / Ctrl+K : cherche ; Entrée : ouvre le premier résultat ; Échap : efface
  document.addEventListener('keydown', e => {
    const typing = /^(input|textarea)$/i.test((e.target.tagName || ''));
    if ((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault(); searchEl.focus(); searchEl.select();
    }
  });
  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchEl.value = ''; searchEl.blur(); renderGrid(); }
    if (e.key === 'Enter') {
      const first = document.querySelector('#grid a.tool');
      if (first) location.href = first.href;
    }
  });

  // Reflet de verre qui suit le pointeur
  document.getElementById('grid').addEventListener('pointermove', e => {
    const ic = e.target.closest('.tool-icon'); if (!ic) return;
    const r = ic.getBoundingClientRect();
    ic.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(0) + '%');
    ic.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(0) + '%');
  });

  // Horloge type barre de menus
  function updateClock() {
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }).replace('.', '') +
      '  ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }
  updateClock(); setInterval(updateClock, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  setInterval(tick, 1000);

  // Premier affichage : copie locale tout de suite (pas d'écran vide), puis liste à jour
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && c.tools) { offset = new Date(c.now).getTime() - Date.now(); tools = c.tools.map(normalize); renderGrid(); }
  } catch (e) {}
  refresh();
</script>

</body>
</html>
