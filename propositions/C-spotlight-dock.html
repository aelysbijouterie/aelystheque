<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposition C — Spotlight + Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'DM Sans',sans-serif;color:#112033;overflow:hidden;
 background:radial-gradient(50% 55% at 25% 30%,#f1d9a0,transparent 70%),radial-gradient(55% 55% at 80% 70%,#b9cfe3,transparent 70%),linear-gradient(160deg,#f7efe4,#e4ebf2)}
.menubar{position:fixed;top:0;left:0;right:0;height:28px;display:flex;align-items:center;gap:18px;padding:0 16px;font-size:.78rem;
 background:rgba(255,255,255,.45);backdrop-filter:blur(24px);border-bottom:1px solid rgba(17,32,51,.06)}
.menubar b{font-family:'Playfair Display',serif;font-size:.85rem}.menubar .sp{margin-left:auto}
.spot{position:relative;z-index:1;width:min(640px,calc(100% - 32px));margin:15vh auto 0;border-radius:22px;overflow:hidden;
 background:rgba(255,255,255,.72);backdrop-filter:blur(40px) saturate(1.5);border:1px solid rgba(255,255,255,.9);
 box-shadow:0 30px 70px rgba(17,32,51,.22),0 2px 6px rgba(17,32,51,.08)}
.q{display:flex;align-items:center;gap:12px;padding:18px 22px;font-size:1.3rem;color:#7a7068;border-bottom:1px solid rgba(17,32,51,.07)}
.q svg{width:22px;height:22px}
.sec{padding:10px 22px 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;color:#9a9086}
.res{display:flex;align-items:center;gap:14px;padding:9px 14px;margin:0 8px;border-radius:12px}
.res:first-of-type{background:rgba(168,123,39,.14)}
.res .i{width:44px;height:44px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.5rem;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(17,32,51,.2)}
.res .t{flex:1;min-width:0}.res b{display:block;font-size:.95rem;font-weight:500}.res small{color:#7a7068;font-size:.76rem}
.res kbd{font:500 .72rem 'DM Sans';color:#7a7068;background:rgba(17,32,51,.06);padding:2px 7px;border-radius:6px}
.g1{background:linear-gradient(155deg,#C9A04A,#7a561b)}.g2{background:linear-gradient(155deg,#4c8fb8,#1d4560)}.g3{background:linear-gradient(155deg,#8c6bd0,#3b2a73)}
.soon .i{background:linear-gradient(155deg,#e8c46a,#c56a8a 60%,#4c6fd0)}
.soon .i::after{content:"";position:absolute;inset:0;backdrop-filter:blur(6px);background:rgba(17,32,51,.3)}
.soon .t{filter:blur(5px)}
.pill{font-size:.78rem;font-weight:500;font-variant-numeric:tabular-nums;color:#A87B27;background:#f6ecd6;padding:4px 11px;border-radius:99px}
.dockwrap{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center}
.dock{display:flex;align-items:flex-end;gap:12px;padding:10px 14px;border-radius:26px;background:rgba(255,255,255,.45);
 backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.8);box-shadow:0 14px 40px rgba(17,32,51,.18)}
.dock .d{width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;
 box-shadow:0 4px 10px rgba(17,32,51,.25);transition:transform .2s cubic-bezier(.2,.8,.2,1);transform-origin:bottom;position:relative;overflow:hidden}
.dock .d:hover{transform:scale(1.35) translateY(-4px)}
.dock .soon-d{background:linear-gradient(155deg,#e8c46a,#c56a8a 60%,#4c6fd0)}
.dock .soon-d::after{content:"";position:absolute;inset:0;backdrop-filter:blur(6px);background:rgba(17,32,51,.35)}
.dock .soon-d span{position:relative;z-index:1;font-size:.6rem;color:#fff;font-weight:600}
.sep{width:1px;align-self:stretch;margin:4px 2px;background:rgba(17,32,51,.15)}
</style></head><body>
<div class="menubar"><b>Aélys</b><span>Aélythèque</span><span>Outils</span><span>Aide</span><span class="sp" id="clock">16:42</span></div>
<div class="spot">
 <div class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Rechercher un outil Aélys…</div>
 <div class="sec">Outils</div>
 <div class="res"><div class="i g1">📚</div><div class="t"><b>Aurel'IA</b><small>Bibliothèque de procédures</small></div><kbd>↵</kbd></div>
 <div class="res"><div class="i g2">🔍</div><div class="t"><b>SIMONE</b><small>Recherche de références</small></div></div>
 <div class="res"><div class="i g3">🖼️</div><div class="t"><b>TEMPO</b><small>Visuels opérations magasin</small></div></div>
 <div class="sec">Bientôt</div>
 <div class="res soon" style="margin-bottom:10px"><div class="i"></div><div class="t"><b>Nouvel outil</b><small>Bientôt disponible</small></div><span class="pill" id="cd">03:00:00</span></div>
</div>
<div class="dockwrap"><div class="dock">
 <div class="d g1">📚</div><div class="d g2">🔍</div><div class="d g3">🖼️</div><div class="sep"></div><div class="d soon-d"><span id="cd2">17:00</span></div>
</div></div>
<script>const t=Date.now()+3*3600e3,p=n=>String(n).padStart(2,'0');
setInterval(()=>{const s=Math.max(0,(t-Date.now())/1000|0);document.getElementById('cd').textContent=`${p(s/3600|0)}:${p(s%3600/60|0)}:${p(s%60)}`},1000);
const n=new Date();document.getElementById('clock').textContent=p(n.getHours())+':'+p(n.getMinutes())</script>
</body></html>
